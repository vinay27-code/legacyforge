spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: jdbc:tc:postgresql:16:///legacyforge_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test
  flyway:
    enabled: true

app:
  cors:
    allowed-origins: http://localhost:4200
  jwt:
    secret: test-secret-that-is-at-least-32-characters-long-1234567890
    access-ttl-minutes: 15
    refresh-ttl-days: 7
  cookie:
    secure: false
    samesite: Lax
  admin:
    email: test-admin@legacyforge.dev
    password: test12345
